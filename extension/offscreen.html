  <head>
    <meta charset="utf-8" />
    <title>TrueBeat recorder (offscreen)</title>
  </head>
  <body>
    <!--
      Offscreen document: the only place a service worker cannot reach where
      getUserMedia + MediaRecorder are available. It records the tab stream,
      uploads the recording to the backend URL set in Options (a Blob cannot
      cross a runtime message) and waits there for the verdict. That backend
      is the only host it contacts; nothing is stored here.
    -->
    <script src="offscreen.js"></script>
  </body>
